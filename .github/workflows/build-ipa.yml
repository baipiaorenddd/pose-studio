name: Build unsigned IPA

# 在 GitHub 的 macOS 云端机器上编译，产出未签名 .ipa
# 下载后由 Sideloadly / AltStore 用个人 Apple ID 签名安装到 iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # 模型 115MB+ 超过 GitHub 单文件 100MB 限制，所以不进仓库，
      # 由 export-coreml 工作流发布到 Release 附件，构建前拉下来。
      # 拉不到也能编译（App 会退回 Apple Vision 识别）。
      - name: 下载 Core ML 姿态模型
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/models PoseStudio
          gh release download models -R "${{ github.repository }}" \
             -p "yolo26x-pose.mlpackage.zip" -D /tmp/models || true
          for z in /tmp/models/*.zip; do
            [ -e "$z" ] || continue
            echo "unzip $z"
            unzip -q -o "$z" -d PoseStudio/
          done
          find PoseStudio -maxdepth 1 -name "*.mlpackage" -print
          du -sh PoseStudio/*.mlpackage 2>/dev/null || echo "no mlpackage -> Apple Vision only"

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -project PoseStudio.xcodeproj \
            -scheme PoseStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tail -80

      - name: 打包 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "找到: $APP"
          test -n "$APP"
          rm -rf Payload PoseStudio.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PoseStudio.ipa Payload
          ls -lh PoseStudio.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PoseStudio-unsigned-ipa
          path: PoseStudio.ipa
          retention-days: 30
