name: Export YOLO pose to Core ML

# 把 Ultralytics 的姿态模型导出成 Core ML（iOS 能直接跑）
# 需要 macOS：coremltools 只有 macOS/Linux 版本

on:
  workflow_dispatch:
    inputs:
      models:
        description: '逗号分隔的模型列表，逐个尝试'
        required: true
        default: 'yolo26x-pose.pt,yolo11x-pose.pt'
      imgsz:
        description: '输入分辨率'
        required: true
        default: '640'

permissions:
  contents: write      # 需要写权限才能创建 Release 并上传附件

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # numpy 必须锁在 1.x：numpy 2.0 移除了「长度 1 的数组当标量用」的旧行为，
          # coremltools 里有用到，会报 "only 0-dimensional arrays can be converted
          # to Python scalars"。1.26.4 同时满足 ultralytics 的 >=1.14.5,<=2.3.5。
          pip install "numpy==1.26.4" ultralytics coremltools
          python -c "import numpy, coremltools; print('numpy', numpy.__version__); print('coremltools', coremltools.__version__)"
          python -c "import onnx; print('onnx', onnx.__version__)" 2>/dev/null || true

      - name: 逐个尝试导出
        env:
          MODELS: ${{ github.event.inputs.models }}
          IMGSZ: ${{ github.event.inputs.imgsz }}
        run: |
          python - <<'PY'
          import os, traceback
          from ultralytics import YOLO

          models = [m.strip() for m in os.environ["MODELS"].split(",") if m.strip()]
          imgsz = int(os.environ.get("IMGSZ", "640"))
          ok, bad = [], []

          for name in models:
              print("=" * 72, flush=True)
              print("TRY:", name, flush=True)
              done = False
              # 先试标准路径（带 NMS），失败再试不带 NMS 的
              for nms in (True, False):
                  try:
                      m = YOLO(name)
                      out = m.export(format="coreml", nms=nms, imgsz=imgsz)
                      print("OK nms=%s -> %s" % (nms, out), flush=True)
                      ok.append("%s(nms=%s)" % (name, nms))
                      done = True
                      break
                  except Exception as e:
                      print("FAIL nms=%s: %s %s" % (nms, type(e).__name__, e), flush=True)
                      traceback.print_exc()
              if not done:
                  bad.append(name)

          print("=" * 72, flush=True)
          print("SUCCEEDED:", ok, flush=True)
          print("FAILED   :", bad, flush=True)
          with open("export_result.txt", "w") as f:
              f.write("ok=%s\nbad=%s\n" % (ok, bad))
          PY

      - name: 列出产物
        if: always()
        run: |
          cat export_result.txt || true
          find . -maxdepth 2 -name "*.mlpackage" -print
          du -sh *.mlpackage 2>/dev/null || true

      - name: 打印模型规格（写 Swift 解码要用）
        if: always()
        run: |
          python - <<'PY'
          import coremltools as ct, glob, os
          pkgs = glob.glob("**/*.mlpackage", recursive=True)
          if not pkgs:
              print("NO MLPACKAGE PRODUCED")
              raise SystemExit(0)
          for p in pkgs:
              print("=" * 72)
              print("PACKAGE:", p)
              total = 0
              for root, _, files in os.walk(p):
                  for f in files:
                      total += os.path.getsize(os.path.join(root, f))
              print("SIZE: %.1f MB" % (total / 1e6))
              try:
                  ml = ct.models.MLModel(p)
                  spec = ml.get_spec()
                  print("--- INPUTS ---")
                  for i in spec.description.input:
                      print("  name=%s" % i.name)
                      print("  type=%s" % i.type)
                  print("--- OUTPUTS ---")
                  for o in spec.description.output:
                      print("  name=%s" % o.name)
                      print("  type=%s" % o.type)
                  print("--- TYPE ---", spec.WhichOneof("Type"))
              except Exception as e:
                  print("spec read failed:", e)
              print("=" * 72)
          PY

      - name: 收集
        if: always()
        run: |
          mkdir -p out
          find . -maxdepth 2 -name "*.mlpackage" -exec cp -R {} out/ \; || true
          cp export_result.txt out/ 2>/dev/null || true
          ls -la out

      # 模型 115MB+ 超过 GitHub 单文件 100MB 限制，不能提交进仓库。
      # 改成发到 Release 附件（支持到 2GB），编译工作流构建前再下载。
      - name: 发布为 Release 附件
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="models"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Core ML models" \
              --notes "YOLO pose 的 Core ML 模型。由 export-coreml 工作流自动发布。"
          for d in out/*.mlpackage; do
            [ -e "$d" ] || continue
            base=$(basename "$d")
            ( cd out && zip -qry "$base.zip" "$base" )
            gh release upload "$TAG" "out/$base.zip" --clobber
            echo "uploaded $base.zip"
          done
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"' || true

      - name: 上传（工作流产物，14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-pose-model
          path: out/**
          retention-days: 14
          if-no-files-found: warn
