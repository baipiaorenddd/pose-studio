name: PoseStudio
options:
  bundleIdPrefix: com.posestudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  PoseStudio:
    type: application
    platform: iOS
    sources:
      # 先收普通源码，把 .mlpackage 排除掉
      - path: PoseStudio
        excludes:
          - "**/*.mlpackage"
      # 再把 .mlpackage 单独作为资源加入，Xcode 会自动编译成 .mlmodelc
      # （模型由构建工作流从 Release 附件下载，仓库里没有；没有时这个 glob 匹配不到，不影响编译）
      - path: PoseStudio
        includes:
          - "**/*.mlpackage"
        buildPhase: resources
    scheme:
      testTargets: []
      gatherCoverageData: false
    info:
      path: PoseStudio/Info.plist
      properties:
        CFBundleDisplayName: Pose Studio
        CFBundleShortVersionString: "1.9"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: 需要使用摄像头实时识别人体姿态，所有处理都在本机完成。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posestudio.app
        PRODUCT_NAME: PoseStudio
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_BITCODE: NO
        # 侧载需要未签名产物，交给 Sideloadly / AltStore 用个人 Apple ID 重新签名
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
        ONLY_ACTIVE_ARCH: NO
